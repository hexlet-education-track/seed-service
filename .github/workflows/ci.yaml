name: CI

on:
  push:
    branches:
      - dev

jobs:
  ckeck:
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v5
      - name: Установить uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Установить зависимости
        run: uv sync
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
        env:
          GREETING: "ci"
          DATABASE_URL: "postgresql://ci:ci@db:5432/ci"
